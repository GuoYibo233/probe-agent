  meta:   {notes: "the full-history whole-call generating probe on the Qwen3.8-27B collection; theta is frozen by the full-history classifier setting"}
  models: {agent: qwen3pt8_27b, probe: qwen3_0pt6b}
  generation: {temperature: 1.0}
