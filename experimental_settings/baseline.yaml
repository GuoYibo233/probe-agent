# Workflow: collect trajectories with the agent model alone, then score them.
# A new experiment is a new named setting in this file (contracts 5.1).
workflow: [sample, score]

common:
  data:   {env: appworld, instructions: v2}
  models: {agent: gpt_oss_120b}

gpt_oss_120b_appworld:
  meta:   {notes: "AppWorld trajectories from gpt-oss-120b with no probe; the baseline an inject run is scored against"}
  sample: {split: [train, dev, test], seeds: [42], pieces: 6, replicas: 1}
  score:  {by_seed: true}

gpt_oss_120b_appworld_t20:
  meta:   {notes: "test 20 random tasks (.scratch/inject-sweep/task-list.md, draw seed 42), one seed; a quick try about the injection"}
  sample: {split: [test], seeds: [42], tasks: ["0a9d82a_1", "2d9f728_2", "2d9f728_3", "325d6ec_1", "325d6ec_2", "325d6ec_3", "3aa1a22_2", "425a494_1", "425a494_3", "6b6ca61_2", "6f4b9a5_3", "7847649_2", "83a7951_2", "9dabbc9_2", "a30375d_3", "d6ac34d_2", "dac78d9_2", "f323bae_1", "f3f60f0_3", "ff58e36_3"], pieces: 6, replicas: 1}
  score:  {by_seed: true}

run_2026_09_30_test_split_168_tasks_baseline:
  meta:   {notes: "the full test split (168 tasks), one seed; the baseline of the 2026-09-30 full-test inject run"}
  sample: {split: [test], seeds: [42], pieces: 6, replicas: 1}
  score:  {by_seed: true}