  <text x="134" y="188" font-size="14" fill="#eb6834" font-weight="600">tool-name accuracy</text>
  <text x="738" y="79" font-size="14" fill="#eb6834" font-variant-numeric="tabular-nums">0.93</text>
  <text x="112" y="166" font-size="13" fill="#eb6834" text-anchor="end" font-variant-numeric="tabular-nums">0.66</text>

  <!-- corner note -->
  <text x="60" y="460" font-size="12.5" fill="#898781">Different eval batch than the main table (here &#952; = 0.95 &#8594; 0.925; there &#952; = 0.975 &#8594; 0.951).</text>
