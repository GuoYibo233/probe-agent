<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 314" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#52514e"/>
    </marker>
  </defs>

  <!-- trajectory -->
  <text x="40" y="40" font-size="16" font-weight="600" fill="#0b0b0b">One trajectory</text>
  <rect x="40" y="58" width="180" height="188" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/>
  <g font-size="13" fill="#52514e">
    <rect x="56" y="74" width="148" height="30" rx="5" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="66" y="94">step 1</text>
    <rect x="56" y="112" width="148" height="30" rx="5" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="66" y="132">step 2</text>
    <rect x="56" y="150" width="148" height="30" rx="5" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/>
    <text x="66" y="170" fill="#0b0b0b">step 3 = one event</text>
    <rect x="56" y="188" width="148" height="30" rx="5" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="66" y="208">&#8230;</text>
  </g>

  <path d="M 226 165 L 280 165" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- zoomed event -->
  <text x="300" y="40" font-size="16" font-weight="600" fill="#0b0b0b">Prefixes at sentence boundaries</text>
  <rect x="300" y="58" width="380" height="34" rx="7" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="310" y="80" font-size="13" fill="#52514e">reasoning text</text>
  <g stroke="#898781" stroke-width="2">
    <line x1="400" y1="58" x2="400" y2="92"/>
    <line x1="500" y1="58" x2="500" y2="92"/>
    <line x1="600" y1="58" x2="600" y2="92"/>
  </g>

  <!-- prefixes -->
  <g>
    <rect x="300" y="112" width="100" height="24" rx="5" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="412" y="129" font-size="13" fill="#52514e">prefix 1 = sample 1</text>
    <rect x="300" y="146" width="200" height="24" rx="5" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="512" y="163" font-size="13" fill="#52514e">prefix 2 = sample 2</text>
    <rect x="300" y="180" width="300" height="24" rx="5" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="612" y="197" font-size="13" fill="#52514e">prefix 3 = sample 3</text>
  </g>

  <!-- shared label -->
  <rect x="300" y="238" width="380" height="56" rx="10" fill="#fde3d9" stroke="#eb6834" stroke-width="1.5"/>
  <text x="320" y="262" font-size="15" font-weight="600" fill="#0b0b0b">Shared label</text>
  <text x="320" y="284" font-size="13.5" font-family="ui-monospace, 'SF Mono', Consolas, monospace" fill="#52514e">apis.spotify.play_song(...)</text>
  <path d="M 350 208 L 350 232" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>


</svg>
