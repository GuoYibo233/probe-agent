<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 292" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#52514e"/>
    </marker>
  </defs>

  <!-- ===== left: the agent loop ===== -->
  <text x="40" y="42" font-size="17" font-weight="600" fill="#0b0b0b">One agent step</text>

  <!-- thinking box -->
  <rect x="40" y="70" width="360" height="86" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="60" y="103" font-size="16" font-weight="600" fill="#0b0b0b">Model reasons</text>

  <!-- tool call box -->
  <rect x="40" y="196" width="164" height="76" rx="10" fill="#fde3d9" stroke="#eb6834" stroke-width="1.5"/>
  <text x="60" y="228" font-size="16" font-weight="600" fill="#0b0b0b">Tool call</text>

  <!-- environment box -->
  <rect x="236" y="196" width="164" height="76" rx="10" fill="#d9f3e9" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="256" y="228" font-size="16" font-weight="600" fill="#0b0b0b">Environment</text>

  <!-- arrows -->
  <path d="M 122 156 L 122 190" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="132" y="180" font-size="13" fill="#898781">ends with</text>
  <path d="M 204 234 L 230 234" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 318 196 L 318 162" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="328" y="184" font-size="13" fill="#898781">result</text>



  <!-- ===== right: a real step, to scale ===== -->
  <text x="480" y="42" font-size="17" font-weight="600" fill="#0b0b0b">A real step (excerpt)</text>

  <rect x="480" y="70" width="400" height="202" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="500" y="98" font-size="13" font-weight="600" fill="#898781">REASONING</text>
  <text x="500" y="122" font-size="13" fill="#52514e">We need to accomplish the task: Reset friends</text>
  <text x="500" y="141" font-size="13" fill="#52514e">on Venmo to be the same as my friends in my phone.</text>
  <text x="500" y="162" font-size="14" fill="#898781">&#8942;</text>
  <text x="500" y="183" font-size="13" fill="#52514e">We need to get supervisor's profile and passwords.</text>
  <text x="500" y="202" font-size="13" fill="#52514e">Let's get supervisor profile.</text>

  <rect x="500" y="216" width="360" height="38" rx="6" fill="#fde3d9" stroke="#eb6834" stroke-width="1.5"/>
  <text x="514" y="240" font-size="13.5" font-family="ui-monospace, 'SF Mono', Consolas, monospace" fill="#0b0b0b">print(apis.supervisor.show_profile())</text>


</svg>
