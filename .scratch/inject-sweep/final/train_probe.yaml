# Workflow: collect, build the dataset, train a probe, evaluate it.
workflow: [sample, build, train, eval]

common:
  data:   {env: appworld, instructions: v1}
  models: {agent: gpt_oss_120b}
  sample: {split: [train, dev, test], seeds: [42], pieces: 6, replicas: 1}

ctool_qwen3_0pt6b:
  meta:   {notes: "classification probe, Qwen3-0.6B-Base, full tuning; the theta source for the generating probes"}
  models: {probe: qwen3_0pt6b}
  probe:  {method: ctool, tuning: full}
  train:  {lr: 1.0e-5, epochs: 1}
  eval:   {risk: [0.10, 0.05]}

cgen_qwen3_0pt6b:
  meta:   {notes: "whole-call generating probe on the same dataset; theta is frozen by ctool_qwen3_0pt6b"}
  models: {probe: qwen3_0pt6b}
  probe:  {method: cgen, tuning: full}
  train:  {lr: 1.0e-5, epochs: 1}
  eval:   {theta_from: train_probe/ctool_qwen3_0pt6b}

cparam_qwen3_0pt6b:
  meta:   {notes: "argument-generating probe on the same dataset; param_only, so it can never be an inject.probe_gen"}
  models: {probe: qwen3_0pt6b}
  probe:  {method: cparam, tuning: full}
  train:  {lr: 1.0e-5, epochs: 1}
  eval:   {theta_from: train_probe/ctool_qwen3_0pt6b}

# The eight settings below import the August np821 probes (no training this
# round, plan of 2026-09-29 in .scratch/inject-sweep/). Each names the same
# 20-task test sample as baseline/gpt_oss_120b_appworld_t20 so the sample
# directory is shared; train.import_from takes the checkpoint over and
# train.max_len is the served window.

imp_ctool_0pt6b_full:
  meta:   {notes: "August np821b06 ctool imported (0.6B full; 3-epoch weights), served window 16k"}
  sample: {split: [test], seeds: [42], tasks: [0a9d82a_1, 2d9f728_2, 2d9f728_3, 325d6ec_1, 325d6ec_2, 325d6ec_3, 3aa1a22_2, 425a494_1, 425a494_3, 6b6ca61_2, 6f4b9a5_3, 7847649_2, 83a7951_2, 9dabbc9_2, a30375d_3, d6ac34d_2, dac78d9_2, f323bae_1, f3f60f0_3, ff58e36_3], pieces: 6, replicas: 1}
  models: {probe: qwen3_0pt6b}
  probe:  {method: ctool, tuning: full}
  train:  {import_from: /net/tokyo100-10g/data/str01_01/y-guo/reproduce/new1/pipeline/runs/np821b06_gptoss_ctool, max_len: 16384}
  eval:   {risk: [0.10, 0.05]}

