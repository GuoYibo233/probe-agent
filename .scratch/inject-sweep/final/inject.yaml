    arm: probe_nofill
    format: p1_e1
    probe_score: train_probe/imp_ctool_0pt6b_full
    probe_gen: train_probe/imp_cgen_0pt6b_full
    pieces: 6
    replicas: 1
  sweep:
    inject.theta: [0.6, 0.75, 0.9]
