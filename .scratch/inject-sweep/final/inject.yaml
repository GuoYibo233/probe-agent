# Workflow: run the agent live with the probe, then score against a baseline.
workflow: [inject, score]

common:
  data:   {env: appworld, instructions: v1}
  models: {agent: gpt_oss_120b}

probe_p1_e1_theta_0pt80:
  meta:  {notes: "live run: fire at theta 0.80, injection format p1_e1, probe arm"}
  inject:
    split: [test]
    seeds: [42]
    theta: 0.80
    arm: probe
    format: p1_e1
    probe_score: train_probe/ctool_qwen3_0pt6b
    probe_gen: train_probe/cgen_qwen3_0pt6b
    pieces: 6
    replicas: 1
  score: {baseline: baseline/gpt_oss_120b_appworld}

no_probe_p1_e1_theta_0pt80:
  meta:  {notes: "control arm: the machinery wired and never firing"}
  inject:
    split: [test]
    seeds: [42]
    theta: 0.80
    arm: no_probe
    format: p1_e1
    probe_score: train_probe/ctool_qwen3_0pt6b
    probe_gen: train_probe/cgen_qwen3_0pt6b
    pieces: 6
    replicas: 1
  score: {baseline: baseline/gpt_oss_120b_appworld}

# The 2026-09-29 sweep (.scratch/inject-sweep/2026-09-29-inject-plan.md): the
# same 20 test tasks as baseline/gpt_oss_120b_appworld_t20, one seed; per
# imported probe pair a probe-arm sweep (4 formats x 3 thetas x 2 history
# lengths) and a no-fill sweep (3 thetas x 2 history lengths), plus two
# no-probe settings. meta.override lets the setting state a history length
# other than the probe's build (the schema's inheritance rule).

sw_0pt6b_full:
  meta:  {notes: "probe arm, 0.6B full pair: 4 formats x 3 thetas x 2 history lengths", override: [build.hist_rounds]}
  inject:
    split: [test]
    seeds: [42]
    tasks: [0a9d82a_1, 2d9f728_2, 2d9f728_3, 325d6ec_1, 325d6ec_2, 325d6ec_3, 3aa1a22_2, 425a494_1, 425a494_3, 6b6ca61_2, 6f4b9a5_3, 7847649_2, 83a7951_2, 9dabbc9_2, a30375d_3, d6ac34d_2, dac78d9_2, f323bae_1, f3f60f0_3, ff58e36_3]
    arm: probe
    probe_score: train_probe/imp_ctool_0pt6b_full
    probe_gen: train_probe/imp_cgen_0pt6b_full
    pieces: 6
    replicas: 1
  sweep:
    inject.theta: [0.6, 0.75, 0.9]
    inject.format: [p1_e1, p1_e2, p2_e1, p2_e2]
    build.hist_rounds: [3, 30]
  score: {baseline: baseline/gpt_oss_120b_appworld_t20}

nf_0pt6b_full:
  meta:  {notes: "no-fill arm, 0.6B full pair: the cut and resume with nothing spliced", override: [build.hist_rounds]}
