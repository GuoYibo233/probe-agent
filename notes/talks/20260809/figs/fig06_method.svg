<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 960 335" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#52514e"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2a78d6"/>
    </marker>
  </defs>

  <text x="60" y="42" font-size="17" font-weight="600" fill="#0b0b0b">Agent reasoning stream (one step)</text>

  <!-- written prefix -->
  <rect x="60" y="70" width="580" height="40" rx="8" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/>
  <!-- unwritten remainder -->
  <rect x="648" y="70" width="212" height="40" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="654" y="95" font-size="13" fill="#898781">not written yet</text>
  <!-- real call marker at far end -->
  <rect x="868" y="70" width="14" height="40" rx="4" fill="#fde3d9" stroke="#eb6834" stroke-width="1.5"/>

  <!-- sentence boundaries -->
  <g stroke="#898781" stroke-width="2">
    <line x1="200" y1="70" x2="200" y2="110"/>
    <line x1="320" y1="70" x2="320" y2="110"/>
    <line x1="440" y1="70" x2="440" y2="110"/>
    <line x1="560" y1="70" x2="560" y2="110"/>
  </g>
  <line x1="640" y1="70" x2="640" y2="110" stroke="#2a78d6" stroke-width="3"/>
  <text x="200" y="132" font-size="13" fill="#898781">sentence boundaries</text>

  <!-- confidence readings under boundaries -->
  <g font-size="14" font-variant-numeric="tabular-nums" text-anchor="middle">
    <text x="200" y="160" fill="#898781">0.31</text>
    <text x="320" y="160" fill="#898781">0.52</text>
    <text x="440" y="160" fill="#898781">0.78</text>
    <text x="560" y="160" fill="#898781">0.87</text>
    <text x="640" y="160" fill="#2a78d6" font-weight="700">0.96</text>
  </g>
  <text x="700" y="160" font-size="13" fill="#52514e">confidence per boundary (illustrative)</text>

  <!-- prefix bracket -->
  <path d="M 60 178 v 8 h 580 v -8" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <text x="350" y="206" font-size="13" fill="#2a78d6" text-anchor="middle">reasoning prefix</text>

  <!-- probe box -->
  <rect x="100" y="250" width="400" height="88" rx="10" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="120" y="282" font-size="16" font-weight="600" fill="#0b0b0b">Probe: Qwen3-0.6B classifier</text>
  <text x="120" y="305" font-size="14" fill="#52514e">task + history + reasoning prefix</text>

  <!-- fire box -->
  <rect x="580" y="250" width="300" height="88" rx="10" fill="#fde3d9" stroke="#eb6834" stroke-width="1.5"/>
  <text x="600" y="282" font-size="16" font-weight="600" fill="#0b0b0b">Prediction</text>
  <text x="600" y="305" font-size="14" fill="#52514e">confidence 0.96 &#8805; &#952; = 0.925</text>
  <text x="600" y="326" font-size="14" fill="#52514e">the next tool call</text>

  <!-- arrows -->
  <path d="M 300 190 Q 300 220 300 244" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrB)"/>
  <path d="M 500 294 L 574 294" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 730 244 L 660 122" fill="none" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 4"/>


</svg>
