# The code-era table: the one place a code change is judged (read as contracts 3.3's
# version block by experimental_settings/schema.py, run.py and jobs/launch.py; appended
# by `run.py version`, or by hand in the same shape). Append-only; rows are in time order.
#
# A row is one of two kinds:
#
#   - stage: train              an era row: from here on, every run of this stage lands in
#     era: 2                    a new directory (the key folds the era), and every stage
#     date: 2026-09-26          downstream of it follows through the folded upstream keys.
#     why: <one sentence>       Write one when a change alters what the stage produces.
#
#   - stage: train              a same row: the stage's code files (the stage table's `code`
#     era: 2                    tuple in experimental_settings/schema.py) at commit `same`
#     from: '1a2b3c4...'        produce what they produced at commit `from`, the launch
#     same: '5d6e7f8...'        commit the code gate printed and the diff was read against.
#     date: 2026-09-26          The gate refuses to read a directory the code has moved past
#     why: <one sentence>       unless a chain of same rows leads from the copy it ran to the
#                               copy in the tree; `run.py version <stage> --same --from
#                               <commit> --why ...` writes one, naming HEAD as `same`.
#
# Rules: the first era row of a stage is era 2 and each later one is one higher; a same row
# carries the era current at its position in the file; every why is non-empty; `from` and
# `same` name commits of this repository, quoted (an all-digit id would load as a number).
# `run.py selfcheck` check 4 holds all of this. Era 1 is the state before a stage's first era
# row. The why sentences are the human record of what the code did when; the `git log` of
# the stage's files holds the rest.
- stage: build
  era: 2
  date: 2026-09-29
  why: Aborted steps are skipped instead of refusing the build over a share of aborted records; the gate
    field build.max_abort_frac is removed.
- stage: train
  era: 2
  date: 2026-09-29
  why: A setting with train.import_from takes over a previous-pipeline checkpoint into best/ (served window
    from train.max_len, the source's calibration in meta.json) instead of training and predicting.
- stage: eval
  era: 2
  date: 2026-09-29
  why: An eval whose train run is an import writes the imported calibration (temperature, theta sweep,
    chosen thetas) into its report marked imported, with the numbers computed from prediction rows absent,
    instead of fitting.
- stage: sample
  era: 1
  from: 6279b5c0de7064e4b5eafcd64829d8737437182a
  same: 0304e1c302b4dadb3a764c6fd59954cd6c09bad5
  date: 2026-09-30
  why: The agent service takes its tensor-parallel size from the launcher flag, equal to the table row's
    value on cards of the declared size, and records gpus and tensor_parallel_size in its endpoint file;
    the serve line and the run's output on the table row's cards are unchanged, and an inject run's eval
    reader is unchanged for a fitted eval.
- stage: inject
